
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaceWise - Master Your Rhythm, Achieve Your Goals</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            accent: {
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Animated Clean Light Gradient Background */
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 35%, #dbeafe 70%, #f0f9ff 100%);
      background-size: 300% 300%;
      animation: lightGradient 18s ease infinite;
    }

    @keyframes lightGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Modern Light Card & Inputs Styling */
    .light-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(224, 242, 254, 0.9);
    }

    .light-input {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #0f172a;
      transition: all 0.25s ease;
    }

    .light-input:focus {
      background: #ffffff;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }

    /* Form Switch Transitions */
    .form-container {
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    }

    .hidden-form {
      display: none;
      opacity: 0;
      transform: translateY(16px);
    }

    .visible-form {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="font-sans min-h-screen text-slate-800 flex items-center justify-center p-4 sm:p-6 overflow-x-hidden">

  <!-- Light Decorative Background Glows -->
  <div class="fixed top-10 left-10 w-96 h-96 bg-sky-300/40 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-10 right-10 w-96 h-96 bg-blue-300/30 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Container Card -->
  <div class="w-full max-w-md sm:max-w-lg light-card rounded-3xl p-6 sm:p-10 shadow-xl shadow-sky-900/5 relative overflow-hidden my-auto">

    <!-- Header Logo & Branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-500 to-accent-500 shadow-md shadow-brand-500/30 mb-3">
        <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">PaceWise</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1 font-medium" id="sub-heading">Master Your Rhythm, Achieve Your Goals</p>
    </div>

    <!-- Toggle Tabs (Login / Register) -->
    <div class="grid grid-cols-2 bg-sky-100/70 p-1.5 rounded-2xl mb-8 border border-sky-200/60">
      <button id="tab-login" onclick="switchForm('login')" class="py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-white text-brand-700 shadow-sm shadow-sky-900/10">
        Sign In
      </button>
      <button id="tab-register" onclick="switchForm('register')" class="py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-500 hover:text-slate-800">
        Create Account
      </button>
    </div>

    <!-- ================= SIGN IN FORM ================= -->
    <form id="form-login" onsubmit="handleLogin(event)" class="form-container visible-form space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email or Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-regular fa-envelope"></i>
          </span>
          <input type="text" id="login-email" required placeholder="alex@university.edu" class="light-input w-full pl-10 pr-4 py-3 rounded-xl text-xs sm:text-sm placeholder-slate-400 focus:outline-none">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-semibold text-slate-700">Password</label>
          <a href="#" onclick="showForgotPassword(event)" class="text-[11px] font-semibold text-brand-600 hover:text-brand-700 hover:underline">Forgot password?</a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="login-password" required placeholder="••••••••" class="light-input w-full pl-10 pr-10 py-3 rounded-xl text-xs sm:text-sm placeholder-slate-400 focus:outline-none">
          <button type="button" onclick="togglePasswordVisibility('login-password', 'toggle-login-icon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
            <i class="fa-regular fa-eye text-xs" id="toggle-login-icon"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center text-xs text-slate-600 cursor-pointer">
          <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500">
          <span class="ml-2 font-medium">Remember me</span>
        </label>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-brand-500 to-accent-500 hover:from-brand-600 hover:to-accent-600 text-white font-semibold py-3 rounded-xl shadow-md shadow-sky-500/20 transition-all duration-300 transform active:scale-[0.99] text-sm mt-2 flex items-center justify-center gap-2">
        <span>Sign In to PaceWise</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>

      <!-- Social Login Options -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
        <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-3 text-slate-400 font-medium rounded-full">Or continue with</span></div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="simulatedSocialLogin('Google')" class="light-input py-2.5 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition shadow-sm">
          <i class="fa-brands fa-google text-red-500"></i> Google
        </button>
        <button type="button" onclick="simulatedSocialLogin('GitHub')" class="light-input py-2.5 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition shadow-sm">
          <i class="fa-brands fa-github text-slate-800"></i> GitHub
        </button>
      </div>
    </form>

    <!-- ================= SIGN UP FORM ================= -->
    <form id="form-register" onsubmit="handleRegister(event)" class="form-container hidden-form space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Full Name</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-regular fa-user"></i>
          </span>
          <input type="text" id="reg-name" required placeholder="Alex Morgan" class="light-input w-full pl-10 pr-4 py-3 rounded-xl text-xs sm:text-sm placeholder-slate-400 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Student Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-regular fa-envelope"></i>
          </span>
          <input type="email" id="reg-email" required placeholder="alex@university.edu" class="light-input w-full pl-10 pr-4 py-3 rounded-xl text-xs sm:text-sm placeholder-slate-400 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Study Major / Course</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-book-open"></i>
          </span>
          <select id="reg-field" class="light-input w-full pl-10 pr-4 py-3 rounded-xl text-xs sm:text-sm text-slate-800 focus:outline-none">
            <option value="Computer Science">Computer Science & IT</option>
            <option value="Engineering">Engineering</option>
            <option value="Mathematics">Mathematics / Physics</option>
            <option value="Medical">Medical & Biological Sciences</option>
            <option value="Arts">Arts & Humanities</option>
            <option value="General">General Studies</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Create Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="reg-password" required placeholder="••••••••" class="light-input w-full pl-10 pr-10 py-3 rounded-xl text-xs sm:text-sm placeholder-slate-400 focus:outline-none">
          <button type="button" onclick="togglePasswordVisibility('reg-password', 'toggle-reg-icon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
            <i class="fa-regular fa-eye text-xs" id="toggle-reg-icon"></i>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Confirm Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-shield-halved"></i>
          </span>
          <input type="password" id="reg-confirm-password" required placeholder="••••••••" class="light-input w-full pl-10 pr-10 py-3 rounded-xl text-xs sm:text-sm placeholder-slate-400 focus:outline-none">
          <button type="button" onclick="togglePasswordVisibility('reg-confirm-password', 'toggle-reg-confirm-icon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
            <i class="fa-regular fa-eye text-xs" id="toggle-reg-confirm-icon"></i>
          </button>
        </div>
      </div>

      <div class="pt-1">
        <label class="flex items-start text-xs text-slate-600 cursor-pointer">
          <input type="checkbox" required class="w-4 h-4 mt-0.5 rounded border-slate-300 text-brand-600 focus:ring-brand-500">
          <span class="ml-2 font-medium">I agree to PaceWise <a href="#" class="text-brand-600 underline font-semibold">Terms of Service</a> & Privacy Policy.</span>
        </label>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-brand-500 to-accent-500 hover:from-brand-600 hover:to-accent-600 text-white font-semibold py-3 rounded-xl shadow-md shadow-sky-500/20 transition-all duration-300 transform active:scale-[0.99] text-sm mt-2 flex items-center justify-center gap-2">
        <span>Create PaceWise Account</span>
        <i class="fa-solid fa-user-plus text-xs"></i>
      </button>
    </form>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

  <script>
    // Toggle Form Switcher
    function switchForm(target) {
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const subHeading = document.getElementById('sub-heading');

      if (target === 'login') {
        loginForm.classList.remove('hidden-form');
        loginForm.classList.add('visible-form');
        regForm.classList.remove('visible-form');
        regForm.classList.add('hidden-form');

        tabLogin.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-white text-brand-700 shadow-sm shadow-sky-900/10';
        tabRegister.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-500 hover:text-slate-800';
        subHeading.textContent = 'Master Your Rhythm, Achieve Your Goals';
      } else {
        regForm.classList.remove('hidden-form');
        regForm.classList.add('visible-form');
        loginForm.classList.remove('visible-form');
        loginForm.classList.add('hidden-form');

        tabRegister.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-white text-brand-700 shadow-sm shadow-sky-900/10';
        tabLogin.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-500 hover:text-slate-800';
        subHeading.textContent = 'Join PaceWise & boost your study productivity';
      }
    }

    // Toggle Password Input Visibility
    function togglePasswordVisibility(inputId, iconId) {
      const passwordInput = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.className = 'fa-regular fa-eye-slash text-xs text-brand-600';
      } else {
        passwordInput.type = 'password';
        icon.className = 'fa-regular fa-eye text-xs text-slate-400';
      }
    }

    // Form Handlers
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;

      showToast(`Welcome back! Logging into PaceWise...`);

      // Store user session mock
      localStorage.setItem('pacewise_user', JSON.stringify({ email: email, loggedIn: true }));

      setTimeout(() => {
        showToast('Login successful! Redirecting to PaceWise dashboard...');
      }, 1000);
    }

    function handleRegister(event) {
      event.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;

      if (pass !== confirmPass) {
        showToast('Passwords do not match. Please check again!');
        return;
      }

      showToast(`Account created for ${name}! 🎉`);

      // Save user state
      localStorage.setItem('pacewise_user', JSON.stringify({ name: name, email: email, loggedIn: true }));

      setTimeout(() => {
        switchForm('login');
        showToast('Please log in with your new PaceWise credentials.');
      }, 1200);
    }

    function showForgotPassword(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      if (!email) {
        showToast('Please enter your email or username first.');
      } else {
        showToast(`PaceWise reset link sent to ${email}`);
      }
    }

    function simulatedSocialLogin(provider) {
      showToast(`Connecting with ${provider}...`);
      setTimeout(() => {
        showToast(`Successfully authenticated PaceWise via ${provider}!`);
      }, 1000);
    }

    // Toast Notification System
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'light-card bg-white/95 text-slate-800 text-xs sm:text-sm font-semibold px-4 py-3 rounded-xl shadow-lg shadow-sky-900/10 flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto border border-sky-100';
      toast.innerHTML = `<i class="fa-solid fa-circle-info text-brand-500"></i> ${msg}`;

      const container = document.getElementById('toast-container');
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
